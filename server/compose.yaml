services:
  db:
    image: postgres:17
    container_name: shelifts-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: shelifts
      POSTGRES_USER: shelifts_user
      POSTGRES_PASSWORD: admin

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shelifts_user -d shelifts"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
